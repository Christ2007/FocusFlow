services:
  focusflow:
    image: christo0000/focusflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focusflow
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - DATABASE_PATH=/data/focusflow.db
    volumes:
      - focusflow-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  focusflow-data:
    name: focusflow-data
